name: Foundation, attention and positions correctness
on: [push, pull_request]
permissions:
  contents: read
jobs:
  cpu-foundation:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install torch==2.10.0 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -r requirements.txt
      - run: python -m pip install --no-build-isolation -e .
      - run: python -m pip check
      - run: python -m pytest -q
      - run: python -m ruff check .
      - run: python -m ruff format --check .
      - run: python scripts/verify_repository.py
      - run: python -m zaid_lm --config configs/baseline.json --device cpu
      - run: python -m experiments.attention_example --figure
      - run: python -m experiments.visualize_causal_mask
      - run: python -m experiments.multihead_shape_trace
      - run: python -m experiments.visualize_positions
      - run: python -m build --no-isolation
      - run: python -m pip install --no-deps --force-reinstall dist/*.whl
      - run: python -m pytest -q
