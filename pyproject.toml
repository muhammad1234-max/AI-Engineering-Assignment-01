[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "zaid-lm"
version = "0.1.0"
description = "Zaid's AI Engineering Assignment 01: independent small LLM foundations"
readme = "README.md"
requires-python = ">=3.11,<3.15"
dependencies = ["torch==2.10.0", "numpy==2.4.6"]

[project.optional-dependencies]
dev = ["pytest==9.0.3", "ruff==0.15.4", "build==1.6.1", "setuptools==84.0.0", "matplotlib==3.10.8"]

[project.scripts]
zaid-lm-config = "zaid_lm.cli:main"
zaid-lm-generate = "zaid_lm.generate:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
